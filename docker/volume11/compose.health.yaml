# Volume 11 local-only health-probe example. It has no Secret values or external dependencies.
services:
  api:
    build:
      context: ../..
      dockerfile: docker/volume11/Dockerfile
    environment:
      AI_PLATFORM_READY: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/livez', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s
